# Temporário (autorizado pelo usuário): baixa arquivos listados em .photo-scratch/request.json. Removido ao final.
name: photo-bridge
on:
  push:
    paths: ['.photo-scratch/request.json']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .photo-scratch/fetch.cjs
      - run: |
          git config user.name "photo-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add .photo-scratch
          git commit -m "photo-bridge: resultado" || exit 0
          git pull --rebase && git push
